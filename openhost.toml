[app]
name = "meditation-timer"
version = "0.1.0"
description = "A personal meditation timer with synthesized bells at fixed or random intervals."

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"
# No public_paths: the app stays login-gated by the OpenHost router.

[resources]
memory_mb = 256
cpu_cores = .5

[data]
# Stores saved timer presets.
sqlite = ["main"]
